version: "3.9"

# ---------------------------------------------------------------------------
# Hybrid Inmon-Kimball Trade Analytics Warehouse — Local Dev Stack
# ---------------------------------------------------------------------------
# Services mirror the 3-VPS production topology on a single machine.
# All connection details are read from .env (copy .env.example → .env).
# ---------------------------------------------------------------------------

networks:
  bi_dw_net:
    driver: bridge

volumes:
  postgres_data:
  postgres_vps1_data:
  saiku_data:

services:
  # -------------------------------------------------------------------------
  # VPS3 equivalent: PostgreSQL Data Warehouse
  # Init scripts are mounted in numeric order so schema creation (00_init.sql)
  # always precedes layer DDLs.
  # -------------------------------------------------------------------------
  postgres_dw:
    image: postgres:16-alpine
    container_name: postgres_dw
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bi_dw}
      POSTGRES_USER: ${POSTGRES_USER:-bi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema init — alphabetical / numeric sort guarantees correct order
      - ./vps3_data_warehouse/00_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./vps3_data_warehouse/01_stage/01_ddl_stage_trade.sql:/docker-entrypoint-initdb.d/01_ddl_stage_trade.sql:ro
      - ./vps3_data_warehouse/01_stage/03_ddl_stage_exchange_rate.sql:/docker-entrypoint-initdb.d/01_stage_03_ddl_stage_exchange_rate.sql:ro
      - ./vps3_data_warehouse/02_ods/01_ddl_ods_trade.sql:/docker-entrypoint-initdb.d/02_ddl_ods_trade.sql:ro
      - ./vps3_data_warehouse/02_ods/02_ddl_ods_exchange_rate.sql:/docker-entrypoint-initdb.d/02_ods_02_ddl_ods_exchange_rate.sql:ro
      - ./vps3_data_warehouse/03_nds/01_ddl_nds_trade.sql:/docker-entrypoint-initdb.d/03_ddl_nds_trade.sql:ro
      - ./vps3_data_warehouse/03_nds/02_ddl_nds_exchange_rate.sql:/docker-entrypoint-initdb.d/03_nds_02_ddl_nds_exchange_rate.sql:ro
      - ./vps3_data_warehouse/04_dds/01_ddl_dds_star.sql:/docker-entrypoint-initdb.d/04_ddl_dds_star.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bi_admin} -d ${POSTGRES_DB:-bi_dw}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bi_dw_net

  # -------------------------------------------------------------------------
  # VPS1 equivalent: Trade Map source DB (landing zone before ETL to VPS3)
  # -------------------------------------------------------------------------
  postgres_vps1:
    image: postgres:16-alpine
    container_name: postgres_vps1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VPS1_POSTGRES_DB:-trademap_db}
      POSTGRES_USER: ${VPS1_POSTGRES_USER:-trademap_admin}
      POSTGRES_PASSWORD: ${VPS1_POSTGRES_PASSWORD:?VPS1_POSTGRES_PASSWORD is required}
    volumes:
      - postgres_vps1_data:/var/lib/postgresql/data
      - ./vps1_data_sources/trademap_ingest/schema.sql:/docker-entrypoint-initdb.d/01_trademap_schema.sql:ro
    ports:
      - "${VPS1_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${VPS1_POSTGRES_USER:-trademap_admin} -d ${VPS1_POSTGRES_DB:-trademap_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bi_dw_net

  # -------------------------------------------------------------------------
  # VPS1 equivalent: Mock Data Source API + static file server
  # -------------------------------------------------------------------------
  mock_api:
    build:
      context: ./vps1_data_sources
      dockerfile: Dockerfile
    container_name: mock_api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - ./vps1_data_sources/raw_data:/app/raw_data:ro
    ports:
      - "${MOCK_API_PORT:-8000}:8000"
    networks:
      - bi_dw_net

  # -------------------------------------------------------------------------
  # VPS2 equivalent: ETL Engine
  # Waits for postgres_dw to be healthy and mock_api to be started.
  # Default CMD runs the full pipeline once; override with 'sleep infinity'
  # for interactive development (see README).
  # -------------------------------------------------------------------------
  etl_engine:
    build:
      context: ./vps2_data_integration
      dockerfile: Dockerfile
    container_name: etl_engine
    restart: "no"
    depends_on:
      postgres_dw:
        condition: service_healthy
      mock_api:
        condition: service_started
    environment:
      # Database — defaults suit local Compose; override DB_HOST in .env on VPS2
      DB_HOST: ${DB_HOST:-postgres_dw}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-bi_dw}
      DB_USER: ${POSTGRES_USER:-bi_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Source API — override VPS1_API_URL in .env on VPS2
      VPS1_API_URL: ${VPS1_API_URL:-http://mock_api:8000}
      # VPS1 Trade Map source DB — used by extract_trademap
      VPS1_DB_HOST: ${VPS1_DB_HOST:-postgres_vps1}
      VPS1_DB_PORT: ${VPS1_DB_PORT:-5432}
      VPS1_POSTGRES_DB: ${VPS1_POSTGRES_DB:-trademap_db}
      VPS1_POSTGRES_USER: ${VPS1_POSTGRES_USER:-trademap_admin}
      VPS1_POSTGRES_PASSWORD: ${VPS1_POSTGRES_PASSWORD:?VPS1_POSTGRES_PASSWORD is required}
      RAW_DATA_PATH: ${RAW_DATA_PATH:-/raw_data}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      REPORT_EMAIL_TO: ${REPORT_EMAIL_TO:-}
    volumes:
      - ./vps1_data_sources/raw_data:/raw_data:ro
      - ./vps2_data_integration:/app
      - ${REPORTS_HOST_DIR:-./vps2_data_integration/reports}:/app/reports
    networks:
      - bi_dw_net

  # -------------------------------------------------------------------------
  # Saiku Analytics (Spicule 2026 relaunch) — MDX/OLAP viewer for the Mondrian
  # cube (Vietnam_Trade_Analysis_Cube). Free, self-hostable, no license.
  # The image bakes in the PostgreSQL driver + cube schema + datasource, so it
  # comes up connected to postgres_dw/dds with the cube queryable by MDX.
  # -------------------------------------------------------------------------
  saiku:
    build:
      context: .
      dockerfile: saiku/Dockerfile
    container_name: saiku
    restart: unless-stopped
    environment:
      # Allow the built-in admin/admin login (evaluation / self-hosted use).
      SAIKU_ALLOW_DEFAULT_ADMIN: "true"
      # Allow charts/dashboards to fetch aggregated result values. The default
      # ai.policy "schema-only" blocks AGGREGATED_RESULT_VALUES, so dashboard
      # charts render an "AI policy does not permit" error.
      SAIKU_AI_POLICY: "aggregated"
      # Put the PostgreSQL JDBC driver on the JVM boot classpath so Mondrian
      # can load it (java -jar ignores -cp; the fat jar has no lib dir).
      JAVA_OPTS: "-Xbootclasspath/a:/drivers/postgresql.jar -Dsaiku.ai.policy=aggregated"
    ports:
      - "${SAIKU_PORT:-8080}:8080"
    depends_on:
      postgres_dw:
        condition: service_healthy
    volumes:
      - saiku_data:/app/saiku-home
    networks:
      - bi_dw_net

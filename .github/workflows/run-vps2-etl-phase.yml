name: Run VPS2 ETL Phase

# Runs one ETL phase group on VPS2. Used by run-vps2-pipeline.yml and manual dispatch.
# Phase groups: extract-stage | stage-ods | ods-nds | nds-dds

on:
  workflow_dispatch:
    inputs:
      phase_group:
        description: ETL phase group to run
        required: true
        type: choice
        options:
          - extract-stage
          - stage-ods
          - ods-nds
          - nds-dds
      batch_id:
        description: Optional pipeline batch UUID (auto-generated when empty)
        required: false
        type: string
      finalize:
        description: Mark the pipeline batch complete after this phase
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      phase_group:
        description: ETL phase group to run
        required: true
        type: string
      batch_id:
        description: Pipeline batch UUID shared across phase jobs
        required: false
        type: string
      finalize:
        description: Mark the pipeline batch complete after this phase
        required: false
        type: boolean
        default: false
    outputs:
      batch_id:
        description: Pipeline batch UUID used for this run
        value: ${{ jobs.run-vps2-etl-phase.outputs.batch_id }}

concurrency:
  group: run-vps2-etl-${{ inputs.phase_group }}
  cancel-in-progress: false

jobs:
  run-vps2-etl-phase:
    name: ETL ${{ inputs.phase_group }} (VPS2 — 178.128.23.125)
    runs-on: ubuntu-22.04
    environment:
      name: vps2-production
    outputs:
      batch_id: ${{ steps.run.outputs.batch_id }}
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS2 to known_hosts
        run: |
          ssh-keyscan -H ${{ vars.VPS2_HOST }} >> ~/.ssh/known_hosts

      - name: Run ETL phase on VPS2
        id: run
        env:
          PHASE_GROUP: ${{ inputs.phase_group }}
          BATCH_ID: ${{ inputs.batch_id }}
          FINALIZE: ${{ inputs.finalize }}
        run: |
          FINALIZE_FLAG=""
          if [ "${FINALIZE}" = "true" ]; then
            FINALIZE_FLAG="--finalize"
          fi

          BATCH_ARG=""
          if [ -n "${BATCH_ID}" ]; then
            BATCH_ARG="--batch-id ${BATCH_ID}"
          fi

          OUTPUT=$(ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=60 \
            ${{ secrets.SSH_USER }}@${{ vars.VPS2_HOST }} << ENDSSH
            set -e
            cd /opt/bi_dw
            docker compose -f docker-compose.vps2.yml run --rm --no-deps etl_engine \
              python run_pipeline.py --phase ${PHASE_GROUP} ${BATCH_ARG} ${FINALIZE_FLAG}
          ENDSSH
          )

          echo "${OUTPUT}"
          PARSED_BATCH_ID=$(echo "${OUTPUT}" | grep '^ETL_BATCH_ID=' | tail -1 | cut -d= -f2)
          if [ -z "${PARSED_BATCH_ID}" ]; then
            echo "Failed to parse ETL_BATCH_ID from pipeline output." >&2
            exit 1
          fi
          echo "batch_id=${PARSED_BATCH_ID}" >> "${GITHUB_OUTPUT}"
          echo "ETL phase '${PHASE_GROUP}' completed. batch_id=${PARSED_BATCH_ID}"

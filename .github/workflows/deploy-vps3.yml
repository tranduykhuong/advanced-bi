name: Deploy VPS3 (PostgreSQL DW)

# Triggered on push when vps3_data_warehouse/ or VPS3 compose file changes.
# Manual run: Actions → Deploy VPS3 (PostgreSQL DW) → Run workflow

on:
  push:
    branches: [main]
    paths:
      - 'vps3_data_warehouse/**'
      - 'docker-compose.vps3.yml'
      - 'saiku/**'
      - 'Vietnam_Trade_Analysis_Cube.mondrian.xml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-vps3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-vps3:
    name: Deploy VPS3 (PostgreSQL DW — 152.42.163.132)
    runs-on: ubuntu-22.04
    environment:
      name: vps3-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS3 to known_hosts
        run: |
          ssh-keyscan -H ${{ vars.VPS3_HOST }} >> ~/.ssh/known_hosts

      # SSH to VPS3 occasionally hits a transient "Connection reset by peer"
      # during key exchange (fail2ban/rate-limit blip, sshd restart, brief
      # network hiccup) — nothing to do with the deployed code. Every network
      # step below retries a few times with a short backoff before failing
      # the job for real.
      - name: Sync directories to VPS3
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            rsync -avz --delete \
              --exclude='.git' \
              ./vps3_data_warehouse/ \
              ${{ secrets.SSH_USER }}@${{ vars.VPS3_HOST }}:/opt/bi_dw/vps3_data_warehouse/
            rsync -avz --delete \
              ./saiku/ \
              ${{ secrets.SSH_USER }}@${{ vars.VPS3_HOST }}:/opt/bi_dw/saiku/
            rsync -avz ./Vietnam_Trade_Analysis_Cube.mondrian.xml \
              ${{ secrets.SSH_USER }}@${{ vars.VPS3_HOST }}:/opt/bi_dw/Vietnam_Trade_Analysis_Cube.mondrian.xml

      - name: Sync docker-compose.vps3.yml and write .env on VPS3
        uses: nick-fields/retry@v3
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            rsync -avz ./docker-compose.vps3.yml \
              ${{ secrets.SSH_USER }}@${{ vars.VPS3_HOST }}:/opt/bi_dw/docker-compose.vps3.yml
            ssh ${{ secrets.SSH_USER }}@${{ vars.VPS3_HOST }} "cat > /opt/bi_dw/.env" <<EOF
            POSTGRES_DB=bi_dw
            POSTGRES_USER=bi_admin
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            APP_ENV=production
            EOF

      - name: Start / recreate postgres_dw on VPS3
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            ssh ${{ secrets.SSH_USER }}@${{ vars.VPS3_HOST }} << 'ENDSSH'
              set -e
              cd /opt/bi_dw
              docker compose -f docker-compose.vps3.yml pull postgres_dw 2>/dev/null || true
              docker compose -f docker-compose.vps3.yml up -d --no-deps postgres_dw
              echo "Waiting for postgres_dw to be healthy..."
              for i in $(seq 1 30); do
                if docker compose -f docker-compose.vps3.yml exec -T postgres_dw pg_isready -U bi_admin -d bi_dw; then
                  echo "postgres_dw is ready."
                  break
                fi
                sleep 3
              done
              docker compose -f docker-compose.vps3.yml ps postgres_dw
            ENDSSH

      - name: Start / recreate saiku on VPS3
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            ssh ${{ secrets.SSH_USER }}@${{ vars.VPS3_HOST }} << 'ENDSSH'
              set -e
              cd /opt/bi_dw
              docker compose -f docker-compose.vps3.yml up -d --build saiku
            ENDSSH

      - name: Apply SQL migrations (idempotent)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            ssh ${{ secrets.SSH_USER }}@${{ vars.VPS3_HOST }} << 'ENDSSH'
              set -e
              cd /opt/bi_dw
              shopt -s nullglob
              for f in vps3_data_warehouse/migrations/*.sql; do
                echo "Applying migration: $f"
                docker compose -f docker-compose.vps3.yml exec -T postgres_dw \
                  psql -v ON_ERROR_STOP=1 -U bi_admin -d bi_dw < "$f"
              done
            ENDSSH

      - name: Verify DW schemas exist
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            ssh ${{ secrets.SSH_USER }}@${{ vars.VPS3_HOST }} \
              "docker compose -f /opt/bi_dw/docker-compose.vps3.yml exec -T postgres_dw \
               psql -U bi_admin -d bi_dw -c '\dn'"

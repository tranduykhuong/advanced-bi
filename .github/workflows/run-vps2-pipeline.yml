name: Run VPS2 ETL Pipeline

# Runs the full ETL pipeline on VPS2 as five sequential CI/CD phase groups.
# Manual run: Actions → Run VPS2 ETL Pipeline → Run workflow
# Called by deploy-all.yml after VPS2 deploy.
# Also runs automatically every day at 18:00 UTC (01:00 ICT/UTC+7) so the
# warehouse picks up new/late-arriving source data daily via UPSERT — no
# manual trigger or deploy required for routine daily loads.

on:
  workflow_dispatch:
  workflow_call:
#   schedule:
#     - cron: "0 18 * * *"   # 18:00 UTC = 01:00 ICT (Vietnam, UTC+7)

concurrency:
  group: run-vps2-pipeline
  cancel-in-progress: false

jobs:
  etl-extract-stage:
    name: ETL Phase 1 — Extract & Load Stage
    uses: ./.github/workflows/run-vps2-etl-phase.yml
    with:
      phase_group: extract-stage
    secrets: inherit

  etl-stage-ods:
    name: ETL Phase 2 — Stage → ODS
    needs: [etl-extract-stage]
    uses: ./.github/workflows/run-vps2-etl-phase.yml
    with:
      phase_group: stage-ods
      batch_id: ${{ needs.etl-extract-stage.outputs.batch_id }}
    secrets: inherit

  etl-ods-nds:
    name: ETL Phase 3 — ODS → NDS
    needs: [etl-extract-stage, etl-stage-ods]
    uses: ./.github/workflows/run-vps2-etl-phase.yml
    with:
      phase_group: ods-nds
      batch_id: ${{ needs.etl-extract-stage.outputs.batch_id }}
    secrets: inherit

  etl-nds-dds:
    name: ETL Phase 4 — NDS → DDS
    needs: [etl-extract-stage, etl-ods-nds]
    uses: ./.github/workflows/run-vps2-etl-phase.yml
    with:
      phase_group: nds-dds
      batch_id: ${{ needs.etl-extract-stage.outputs.batch_id }}
    secrets: inherit

  etl-mining:
    name: ETL Phase 5 — Mining (ODS risk classifiers)
    needs: [etl-extract-stage, etl-nds-dds]
    uses: ./.github/workflows/run-vps2-etl-phase.yml
    with:
      phase_group: mining
      batch_id: ${{ needs.etl-extract-stage.outputs.batch_id }}
      finalize: true
    secrets: inherit

name: Deploy VPS1 (Mock API + Trade Map DB)

# Deploys mock_api + postgres_vps1 only. CSV ingest (ingest_trademap.py) is manual — not in CI/CD.
# Triggered on push when vps1_data_sources/ or VPS1 compose file changes.

on:
  push:
    branches: [main]
    paths:
      - 'vps1_data_sources/**'
      - 'docker-compose.vps1.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-vps1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-vps1:
    name: Deploy VPS1 (Sources — 134.209.99.243)
    runs-on: ubuntu-22.04
    environment:
      name: vps1-production
      url: http://134.209.99.243:8000/docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS1 to known_hosts
        run: |
          ssh-keyscan -H ${{ vars.VPS1_HOST }} >> ~/.ssh/known_hosts

      - name: Sync vps1_data_sources to VPS1
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            ./vps1_data_sources/ \
            ${{ secrets.SSH_USER }}@${{ vars.VPS1_HOST }}:/opt/bi_dw/vps1_data_sources/

      - name: Sync docker-compose.vps1.yml and write .env on VPS1
        env:
          VPS1_POSTGRES_PASSWORD: ${{ secrets.VPS1_POSTGRES_PASSWORD }}
        run: |
          rsync -avz ./docker-compose.vps1.yml \
            ${{ secrets.SSH_USER }}@${{ vars.VPS1_HOST }}:/opt/bi_dw/docker-compose.vps1.yml
          ssh ${{ secrets.SSH_USER }}@${{ vars.VPS1_HOST }} "cat > /opt/bi_dw/.env" <<EOF
          VPS1_POSTGRES_DB=trademap_db
          VPS1_POSTGRES_USER=trademap_admin
          VPS1_POSTGRES_PASSWORD=${VPS1_POSTGRES_PASSWORD}
          VPS1_POSTGRES_PORT=5432
          APP_ENV=production
          MOCK_API_PORT=8000
          EOF

      - name: Build and restart VPS1 services
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ vars.VPS1_HOST }} << 'ENDSSH'
            set -e
            cd /opt/bi_dw
            docker compose -f docker-compose.vps1.yml build mock_api
            docker compose -f docker-compose.vps1.yml up -d postgres_vps1 mock_api
            echo "Waiting for postgres_vps1..."
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.vps1.yml exec -T postgres_vps1 \
                pg_isready -U trademap_admin -d trademap_db; then
                echo "postgres_vps1 is ready."
                break
              fi
              sleep 2
            done
            docker compose -f docker-compose.vps1.yml ps
          ENDSSH

      - name: Smoke-test VPS1 health endpoint
        run: |
          sleep 5
          curl --fail --max-time 10 http://${{ vars.VPS1_HOST }}:8000/health \
            || (echo "Health check failed!" && exit 1)

# ---------------------------------------------------------------------------
# VPS3 stack — PostgreSQL Data Warehouse
# Deploy on 152.42.163.132 (or locally: docker compose -f docker-compose.vps3.yml up -d)
# ---------------------------------------------------------------------------

version: "3.9"

networks:
  vps3_net:
    driver: bridge

volumes:
  postgres_data:
  saiku_data:

services:
  postgres_dw:
    image: postgres:16-alpine
    container_name: postgres_dw
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bi_dw}
      POSTGRES_USER: ${POSTGRES_USER:-bi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./vps3_data_warehouse/00_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./vps3_data_warehouse/01_stage/01_ddl_stage_trade.sql:/docker-entrypoint-initdb.d/01_ddl_stage_trade.sql:ro
      - ./vps3_data_warehouse/01_stage/02_ddl_stage_aptiad.sql:/docker-entrypoint-initdb.d/02_ddl_stage_aptiad.sql:ro
      - ./vps3_data_warehouse/02_ods/01_ddl_ods_trade.sql:/docker-entrypoint-initdb.d/02_ddl_ods_trade.sql:ro
      - ./vps3_data_warehouse/03_nds/01_ddl_nds_trade.sql:/docker-entrypoint-initdb.d/03_ddl_nds_trade.sql:ro
      - ./vps3_data_warehouse/04_dds/01_ddl_dds_star.sql:/docker-entrypoint-initdb.d/04_ddl_dds_star.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bi_admin} -d ${POSTGRES_DB:-bi_dw}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vps3_net

  saiku:
    build:
      context: .
      dockerfile: saiku/Dockerfile
    container_name: saiku
    restart: unless-stopped
    environment:
      SAIKU_ALLOW_DEFAULT_ADMIN: "true"
      SAIKU_AI_POLICY: "aggregated"
      JAVA_OPTS: "-Xbootclasspath/a:/drivers/postgresql.jar -Dsaiku.ai.policy=aggregated"
    ports:
      # Expose port 8080 (or custom $SAIKU_PORT) out to the internet
      - "0.0.0.0:${SAIKU_PORT:-8080}:8080"
    depends_on:
      postgres_dw:
        condition: service_healthy
    volumes:
      - saiku_data:/app/saiku-home
    networks:
      - vps3_net

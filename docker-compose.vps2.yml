# ---------------------------------------------------------------------------
# VPS2 stack — ETL Engine (connects to remote VPS3 DB + VPS1 API)
# Deploy on 178.128.23.125 (or locally with overrides in .env)
# ---------------------------------------------------------------------------

version: "3.9"

networks:
  vps2_net:
    driver: bridge

services:
  etl_engine:
    build:
      context: ./vps2_data_integration
      dockerfile: Dockerfile
    container_name: etl_engine
    restart: "no"
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-bi_dw}
      DB_USER: ${POSTGRES_USER:-bi_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      VPS1_API_URL: ${VPS1_API_URL:?VPS1_API_URL is required}
      RAW_DATA_PATH: ${RAW_DATA_PATH:-/raw_data}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./vps1_data_sources/raw_data:/raw_data:ro
    networks:
      - vps2_net
